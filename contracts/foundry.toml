[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true

# Enables compatibility with FISCO BCOS v3 and Base Sepolia
# solc 0.8.20 + paris EVM avoids PUSH0 opcode (Shanghai/0.8.24)
